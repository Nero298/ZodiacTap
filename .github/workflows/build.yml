name: Build ZodiacTap APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - name: Cache Gradle & Cargo
        uses: actions/cache@v4
        with:
          path: |
            \~/.gradle/caches
            \~/.gradle/wrapper
            \~/.cargo/registry
            \~/.cargo/git
            evdev/src/main/rust/evdev_manager/target
          key: \( {{ runner.os }}-gradle-rust- \){{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rust-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build CI APK
        run: ./gradlew clean assembleCi --stacktrace

      - name: List built APKs
        run: find app/build/outputs/apk -name "*.apk" -type f

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZodiacTap-APK
          path: |
            app/build/outputs/apk/ci/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
